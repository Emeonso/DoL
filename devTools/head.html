<style id="style-named-npc-portrait" type="text/css">.named-npc-portrait{float:left;width:180px;height:190px;overflow:hidden;margin:0 1em .5em 0;border:1px solid rgba(128,128,128,.35);background:rgba(0,0,0,.08)}.named-npc-portrait canvas{display:block;width:220px;height:220px;margin:-10px -20px}.named-npc-portrait:after{content:"";display:block;clear:both}@media screen and (max-width:600px){.named-npc-portrait{width:140px;height:155px}.named-npc-portrait canvas{width:180px;height:180px;margin:-8px -20px}}.named-npc-portrait-button{display:inline;padding:0;margin:0;border:0;background:transparent!important;color:var(--link);font:inherit;line-height:inherit;text-align:inherit;text-decoration:underline}.named-npc-portrait-button:hover,.named-npc-portrait-button:focus{background:transparent!important;border-color:transparent;color:var(--link-hover);text-decoration:underline}.named-npc-portrait-tooltip{display:block;box-sizing:border-box;width:100%;max-width:430px;min-width:0;margin:.45em 0 0;padding:.45em;border:2px solid var(--300);border-radius:.25em;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(0,0,0,.22));box-shadow:inset 0 0 0 1px var(--750),0 .15em .4em rgba(0,0,0,.3);line-height:normal;text-align:left}.named-npc-portrait-tooltip[hidden]{display:none}.named-npc-portrait-tooltip-header{display:flex;align-items:baseline;justify-content:space-between;gap:.5em;margin:-.1em -.1em .4em;padding:.25em .35em;border-bottom:3px solid var(--gold);background:linear-gradient(110deg,rgba(0,0,0,.28) 0 72%,var(--gold) 72% 76%,transparent 76%);letter-spacing:.05em}.named-npc-portrait-tooltip-header-label{font-size:.9em}.named-npc-portrait-tooltip-body{display:grid;grid-template-columns:1fr;gap:.55em;align-items:start}.named-npc-portrait-tooltip-canvas{display:block;width:180px;height:190px;margin:0 auto;overflow:hidden;border:1px solid rgba(128,128,128,.35);background:rgba(0,0,0,.16)}.named-npc-portrait-tooltip-canvas canvas{display:block;width:220px;height:220px;margin:-10px -20px}.named-npc-portrait-info{display:block;min-width:0;padding:.45em .35em .25em;border-top:1px solid var(--750)}.named-npc-portrait-info-name{display:block;overflow-wrap:anywhere;font-size:1.1em;font-weight:700}.named-npc-portrait-info-species{display:block;margin:.1em 0 .55em;color:var(--gold);font-size:.85em;font-style:italic}.named-npc-portrait-info-grid{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.22em .5em;font-size:.82em}.named-npc-portrait-info-label{color:var(--300);font-size:.75em;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.named-npc-portrait-info-value{min-width:0;overflow-wrap:anywhere}.named-npc-portrait-tooltip-message{display:block;margin:.35em .15em 0;color:var(--red);font-size:.85em}.named-npc-portrait-tooltip-message[hidden]{display:none}@media screen and (max-width:600px){.named-npc-portrait-tooltip{max-width:100%}.named-npc-portrait-tooltip-body{grid-template-columns:1fr}.named-npc-portrait-tooltip-canvas{margin:0 auto}.named-npc-portrait-info{border-top:1px solid var(--750);border-left:0;padding-top:.45em}}</style>
